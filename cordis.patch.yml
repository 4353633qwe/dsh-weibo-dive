# ============================================================================
# dsh-weibo-dive —— DSH bundle patch（插件自带的挂载声明）
# ============================================================================
# 装上之后，profile 只要在 `dsh.profile.bundles` 里列出本包名即生效：
#   dsh plugin --profile web add dsh-weibo-dive
#
# ⚠️ 这里**不要**写 `config:`。原因有两条，都踩过：
#   1. 这台宿主（0.2.1-rc.5）的插件设置页是按运行时的 settings 注册表渲染的，
#      光在配置层写 config 并不会让「微博」那一项出现；
#   2. 一旦这里有 config，它就成了配置真源，会把 `~/.dsh/weibo-dive/config.json`
#      里用工具改的值覆盖回去（两个 profile 还各有一份，更容易打架）。
#
# 所以：**config.json 是唯一真源**，改配置用 weibo_settings 工具或直接编辑那个文件。
# 将来宿主支持第三方插件设置页时，插件导出的 Config 会自动接管，不用改这里。
# ============================================================================

- insert:
    - id: weibo-dive
      name: dsh-weibo-dive
